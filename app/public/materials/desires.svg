<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="desires fabric swatch">
  <defs>
    <radialGradient id="g-desires" cx="35%" cy="30%" r="85%">
      <stop offset="0%"  stop-color="#8fd1ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#3aa3e8"      stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a5e93"   stop-opacity="1"/>
    </radialGradient>
    <pattern id="weave-a-desires" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#1a5e93" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
    <pattern id="weave-b-desires" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#8fd1ff" stroke-opacity="0.22" stroke-width="2"/>
    </pattern>
    <radialGradient id="vignette-desires" cx="50%" cy="55%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g-desires)"/>
  <rect width="100%" height="100%" fill="url(#weave-a-desires)"/>
  <rect width="100%" height="100%" fill="url(#weave-b-desires)"/>
  <rect width="100%" height="100%" fill="url(#vignette-desires)"/>
</svg>
